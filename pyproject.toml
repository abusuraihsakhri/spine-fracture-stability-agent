[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-fracture-stability-engine"
version = "2.0.0"
description = "SpineStability Sentinel: TLICS & Subaxial Cervical Spine Injury Staging Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
spine-fracture-stability-engine = "spine_fracture_stability_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/spine-fracture-stability-engine"
Repository = "https://github.com/abusuraihsakhri/spine-fracture-stability-engine.git"
