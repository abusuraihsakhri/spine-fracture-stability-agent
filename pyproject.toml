[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-fracture-stability-engine"
version = "2.0.0"
description = "SpineStability Sentinel: TLICS & Subaxial Cervical Spine Injury Staging Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.20,<1"]
dev = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
spine-fracture-stability-engine = "spine_fracture_stability_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/spine-fracture-stability-agent"
Repository = "https://github.com/abusuraihsakhri/spine-fracture-stability-engine.git"

[tool.setuptools]
packages = ["agents", "spine_fracture_stability_agent"]
py-modules = [
    "cli", "spine_stability", "enrichment", "simulator",
    "spine_fracture_stability_agent_app", "spine_stability_app",
]
